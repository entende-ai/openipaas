name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma needs the variable to parse schema.prisma. Nothing connects:
      # dashboard pages are force-dynamic, so the build never queries.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Verifies the lockfile is self-consistent, which is how the missing
      # rolldown binding went unnoticed.
      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx next build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Proves the committed migrations actually apply to an empty database,
      # which is exactly what a self-hoster does on first boot.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # Fails if schema.prisma has drifted from the migration files.
      - name: Check for schema drift
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
