name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma needs the variable to parse schema.prisma. Nothing connects:
      # dashboard pages are force-dynamic, so the build never queries.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Verifies the lockfile is self-consistent, which is how the missing
      # rolldown binding went unnoticed.
      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx next build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Proves the committed migrations actually apply to an empty database,
      # which is exactly what a self-hoster does on first boot.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      # The unit tests fake the database, so they cannot show that the advisory
      # lock around token refresh really excludes a second instance. Without it,
      # a provider that rotates refresh tokens (RD Station CRM) disconnects
      # healthy accounts whenever two requests hit an expiry together.
      #
      # Runs before the drift check, which reuses this database as its shadow
      # and resets it.
      - name: Token refresh holds across instances
        run: npx vitest run src/tests/integration
        env:
          INTEGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}

      # Fails if schema.prisma has drifted from the migration files.
      - name: Check for schema drift
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code

  # Nothing exercised the Dockerfile until now. Two fatal bugs shipped because
  # of it: a COPY of a file Next never emits, and an Alpine base whose musl
  # runtime cannot load the glibc tailwind binding the lockfile pins. Both only
  # surfaced when someone tried to deploy.
  #
  # docker-publish.yml builds the same file, but only on a release, which is far
  # too late to learn the image is broken.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openipaas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not enough: the previous Dockerfile built fine and then
      # died at boot, because the entrypoint referenced tooling the runtime
      # stage did not carry. This runs the real entrypoint against a real
      # database and waits for the app to answer.
      - name: Boot it against a real database
        run: |
          docker network create ci

          docker run -d --name db --network ci \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=ipaas \
            --health-cmd "pg_isready -U postgres" \
            --health-interval 2s --health-retries 30 \
            postgres:15

          # Start the app only once Postgres actually answers, so a failure
          # here means the image is broken rather than that it lost a race.
          until [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = healthy ]; do
            sleep 2
          done

          docker run -d --name app --network ci -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:postgres@db:5432/ipaas \
            -e CREDENTIALS_ENCRYPTION_KEY=JMSVEcE0PMQvBmpxIsX0eXEsgi7dwHyKfxDTVIRvHSM= \
            -e DASHBOARD_PASSWORD=ci-only \
            -e DASHBOARD_SESSION_SECRET=AXyLl9pyKq0hqRYrEDsSKHJ3XyWJXCcTOAo7EAiK6WU= \
            -e INTERNAL_JOB_SECRET=ci-only-job-secret \
            openipaas:ci

          # The entrypoint waits for the database and applies migrations, so
          # this is also the only place the shipped migrations are proven to
          # run from inside the image.
          # The entrypoint itself waits up to 60s for Postgres, so this has to
          # allow for that plus the migrations and the server starting.
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3000/api/unified/v1/providers >/dev/null 2>&1; then
              echo "The app answered after ${i}s."
              exit 0
            fi
            sleep 1
          done

          echo "The app never answered. Container logs:"
          docker logs app
          exit 1

      # Answering a request is not proof the database layer works. The probe
      # above needs neither Prisma nor Postgres, so it passed while the image
      # carried a query engine built for the wrong OpenSSL, which only failed
      # on the first real query. Migrations do not catch it either: they use
      # the schema engine, not the query engine.
      - name: Query the database through Prisma
        run: |
          docker exec app node -e "
            const { PrismaClient } = require('@prisma/client');
            new PrismaClient().client.count()
              .then((n) => { console.log('Query engine loaded, ' + n + ' clients.'); process.exit(0); })
              .catch((e) => { console.error(e); process.exit(1); });
          "

      # A missing DATABASE_URL is the most likely first-deploy mistake, and the
      # entrypoint used to retry it thirty times before giving up, burying the
      # one useful line under a minute of identical stack traces.
      - name: Fail fast when DATABASE_URL is missing
        run: |
          if docker run --rm --name misconfigured openipaas:ci > out.log 2>&1; then
            echo "Booted with no DATABASE_URL. It should have refused."
            exit 1
          fi

          cat out.log
          grep -q "DATABASE_URL is not set" out.log
          # Retrying a permanent error is the bug this guards against.
          if grep -q "retrying in 2s" out.log; then
            echo "Retried a configuration error that cannot resolve itself."
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker logs app || true
