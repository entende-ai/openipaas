version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ipaas-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ipaas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ipaas-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipaas-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ipaas_dev
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      # Local development only: the seed wipes every table before inserting fixtures.
      - RUN_SEED=true
      # Sourced from your shell/.env. Without an encryption key the app stores
      # credentials in plaintext in dev, and refuses to start in production.
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - DASHBOARD_SESSION_SECRET=${DASHBOARD_SESSION_SECRET:-}
      - INTERNAL_JOB_SECRET=${INTERNAL_JOB_SECRET:-}
      - CONTA_AZUL_CLIENT_ID=${CONTA_AZUL_CLIENT_ID:-}
      - CONTA_AZUL_CLIENT_SECRET=${CONTA_AZUL_CLIENT_SECRET:-}
      # Shared rate-limit and idempotency state. Required once more than one
      # instance runs; optional for a single container.
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
